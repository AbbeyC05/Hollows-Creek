name: Fix Joanne residents section

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Joanne from B to R
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          joanne = '<button class="resident-row" onclick="showResident(\'Joanne Rose Reid\')"><span>Joanne Rose Reid</span><small>Reid Family</small></button>'
          t = t.replace(joanne, '', 1)

          old_az = '<div class="az"><a href="#res-b">B</a></div>'
          new_az = '<div class="az"><a href="#res-b">B</a><a href="#res-r">R</a></div>'
          if old_az in t:
              t = t.replace(old_az, new_az, 1)

          b_end = '''    </section>\n  </main>\n  <footer>HOLLOW'S CREEK • RESIDENT DIRECTORY</footer>'''
          r_section = '''    </section>\n    <section class="letter-group" id="res-r">\n      <div class="letter">R</div>\n      <div class="resident-list">\n        <button class="resident-row" onclick="showResident('Joanne Rose Reid')"><span>Joanne Rose Reid</span><small>Reid Family</small></button>\n      </div>\n    </section>\n  </main>\n  <footer>HOLLOW'S CREEK • RESIDENT DIRECTORY</footer>'''
          if 'id="res-r"' not in t and b_end in t:
              t = t.replace(b_end, r_section, 1)

          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move Joanne Reid to R residents section"
          git push
