name: Fix family tree parents
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Beaumont parent links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('family-tree/index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace("{id:'lukasSr',name:'Lukas Henry Beaumont',family:'Beaumont',x:390,y:90,meta:'Beaumont patriarch',partners:['joanne'],children:['lukasJr','charlie','libby','bethany','reece','leon','bradley','becca','harper','melissa','celia','henry','riley']},", "{id:'lukasSr',name:'Lukas Henry Beaumont',family:'Beaumont',x:390,y:90,meta:'Beaumont patriarch',partners:['jewel','joanne'],children:['lukasJr','charlie','libby','bethany','reece','leon','bradley','becca','harper','melissa','celia','henry','riley']},")
          t=t.replace("{id:'joanne',name:'Joanne Rose Reid',family:'Other',x:600,y:90,meta:'Reid family • mother',partners:['lukasSr'],children:['lukasJr','charlie','libby','bethany','reece','leon','bradley','becca','harper','melissa','celia','henry','riley']},", "{id:'jewel',name:'Jewel Lewandowski',family:'Other',x:180,y:90,meta:'Mother of Lukas Jr & Charlie',partners:['lukasSr'],children:['lukasJr','charlie']},{id:'joanne',name:'Joanne Rose Reid',family:'Other',x:600,y:90,meta:'Mother of Libby, Bethany, Reece, Leon, Bradley & Rebecca',partners:['lukasSr'],children:['libby','bethany','reece','leon','bradley','becca']},")
          reps={
            "['joanne','lukasJr']":"['jewel','lukasJr']",
            "['joanne','charlie']":"['jewel','charlie']",
            ",['joanne','harper']":"",
            ",['joanne','melissa']":"",
            ",['joanne','celia']":"",
            ",['joanne','henry']":"",
            ",['joanne','riley']":"",
            "const marriages=[['lukasSr','joanne']":"const marriages=[['lukasSr','jewel'],['lukasSr','joanne']",
            "const marriages = [['lukasSr','joanne']":"const marriages = [['lukasSr','jewel'],['lukasSr','joanne']"
          }
          for a,b in reps.items(): t=t.replace(a,b)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-tree/index.html
          git commit -m "Correct Beaumont mothers in family tree"
          git push