name: Add all Beaumont profile photos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Beaumont photos to profiles
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          changed = False

          if '.profile-photo{' not in t:
              marker = '@media(max-width:760px){.profile-grid{grid-template-columns:1fr}.album-grid,.links-grid{grid-template-columns:1fr}}'
              css = '.profile-photo{width:100%;max-height:520px;object-fit:cover;object-position:center top;display:block;border:1px solid #dfd1bd;margin-bottom:18px;background:#eee}\n'
              if marker in t:
                  t = t.replace(marker, css + marker, 1)
                  changed = True

          profiles = [
              ('lukasProfile', 'lukas-profile.png', 'Lukas Henry Beaumont'),
              ('rosaProfile', 'rosa-profile.png', 'Rosa Beaumont'),
              ('lukasJrProfile', 'lukas-jr-profile.png', 'Lukas Henry Beaumont Jr'),
              ('charlieProfile', 'charlie-profile.png', 'Charlie Steven Beaumont'),
              ('libbyProfile', 'libby-profile.png', 'Libby Christine Beaumont'),
              ('bethanyProfile', 'bethany-profile.png', 'Bethany Alana Beaumont'),
              ('reeceProfile', 'reece-profile.png', 'Reece Ethan Beaumont'),
              ('leonProfile', 'leon-profile.png', 'Leon Alex Beaumont'),
              ('bradleyProfile', 'bradley-profile.png', 'Bradley Marcus Beaumont'),
              ('beccaProfile', 'becca-profile.png', 'Rebecca Rose Beaumont'),
              ('harperProfile', 'harper-profile.png', 'Harper Victoria Beaumont'),
              ('melissaProfile', 'melissa-profile.png', 'Melissa Mary Beaumont'),
              ('celiaProfile', 'celia-profile.png', 'Celia Isabella Beaumont'),
              ('henryProfile', 'henry-profile.png', 'Henry Luke Beaumont'),
              ('rileyProfile', 'riley-profile.png', 'Riley Faith Beaumont'),
          ]

          for section_id, filename, alt in profiles:
              if f'src="{filename}"' in t:
                  continue
              section = f'<section id="{section_id}" class="page">'
              start = t.find(section)
              if start == -1:
                  raise SystemExit(f'{section_id} section not found')
              aside = '<aside class="bio-panel">'
              pos = t.find(aside, start)
              if pos == -1:
                  raise SystemExit(f'{section_id} bio panel not found')
              insert_at = pos + len(aside)
              img = f'\n        <img class="profile-photo" src="{filename}" alt="{alt}">'
              t = t[:insert_at] + img + t[insert_at:]
              changed = True

          if changed:
              p.write_text(t, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add all Beaumont profile photos"
          git push
