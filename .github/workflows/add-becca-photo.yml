name: Add Becca profile photo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Becca photo to profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          changed = False

          if '.profile-photo{' not in t:
              marker = '@media(max-width:760px){.profile-grid{grid-template-columns:1fr}.album-grid,.links-grid{grid-template-columns:1fr}}'
              css = '.profile-photo{width:100%;max-height:520px;object-fit:cover;object-position:center top;display:block;border:1px solid #dfd1bd;margin-bottom:18px;background:#eee}\n'
              if marker in t:
                  t = t.replace(marker, css + marker, 1)
                  changed = True

          if 'src="becca-profile.png"' not in t:
              section = '<section id="beccaProfile" class="page">'
              start = t.find(section)
              if start == -1:
                  raise SystemExit('Becca profile section not found')
              aside = '<aside class="bio-panel">'
              pos = t.find(aside, start)
              if pos == -1:
                  raise SystemExit('Becca bio panel not found')
              insert_at = pos + len(aside)
              t = t[:insert_at] + '\n        <img class="profile-photo" src="becca-profile.png" alt="Rebecca Rose Beaumont">' + t[insert_at:]
              changed = True

          if changed:
              p.write_text(t, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Becca profile photo to page"
          git push
