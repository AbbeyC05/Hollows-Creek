<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow's Creek</title>
<script>
fetch('site-base.html')
  .then(r => {
    if (!r.ok) throw new Error('Could not load site-base.html');
    return r.text();
  })
  .then(html => {
    document.open();
    document.write(html);
    document.close();

    const loadScript = (src, label) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = () => console.log(label + ' loaded');
      script.onerror = () => console.error('Could not load ' + src);
      document.body.appendChild(script);
    };

    const loadAllPatches = () => {
      loadScript('site-patches.js?v=5', 'Main Montague profiles');
      loadScript('alexandria-profile-patch.js?v=3', 'Alexandria Montague profile');
      loadScript('delphini-profile-patch.js?v=2', 'Delphini Montague profile');
      loadScript('holt-family-patch.js?v=3', 'Holt family page');
      loadScript('holt-profiles-patch.js?v=1', 'Holt resident profiles');
      loadScript('bardot-family-patch.js?v=1', 'Bardot family page');
      loadScript('bardot-profiles-patch.js?v=1', 'Bardot resident profiles');
      loadScript('blakely-brown-patch.js?v=1', 'Blakely and Brown families');
      loadScript('carter-family-patch.js?v=1', 'Carter family and resident profiles');
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadAllPatches, { once: true });
    } else {
      loadAllPatches();
    }
  })
  .catch(err => {
    document.body.innerHTML = '<p style="padding:30px;font-family:Arial">The Hollow\'s Creek archive could not load. Please refresh the page.</p>';
    console.error(err);
  });
</script>
</head>
<body></body>
</html>
