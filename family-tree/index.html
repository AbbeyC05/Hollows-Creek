<style>
:root{--bg:#100d12;--panel:#1a151d;--text:#f8eef6;--muted:#b8aab6;--line:#6b5d69;--accent:#f3a6cf;--shadow:0 14px 40px rgba(0,0,0,.28);--beaumont:#f3a6cf;--montague:#a98de7;--holt:#77b7d7;--walker:#78c6a3;--whitmore:#d3b36e;--reid:#cf8fb0;--other:#b7a7b5}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr}header{padding:14px 16px;border-bottom:1px solid #2e2532;background:rgba(16,13,18,.97);backdrop-filter:blur(10px);z-index:10}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;letter-spacing:.2px;margin-right:auto}.brand span{color:var(--accent)}.controls{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}.btn,.chip{border:1px solid #3a303e;background:#1d1721;color:var(--text);border-radius:999px;padding:8px 12px;cursor:pointer}.btn:hover,.chip:hover{background:#2a2130}.chip.active{background:#f3a6cf;color:#24131d;border-color:#f3a6cf;font-weight:800}.search{min-width:220px;border:1px solid #3a303e;background:#171219;color:var(--text);border-radius:999px;padding:9px 13px;outline:none}.search:focus{border-color:#8c7185}.subbar{display:flex;gap:8px;align-items:center;margin-top:10px;overflow:auto;padding-bottom:2px}.workspace{position:relative;overflow:hidden}#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;background:radial-gradient(circle at 20% 20%,rgba(243,166,207,.06),transparent 28%),radial-gradient(circle at 80% 25%,rgba(169,141,231,.06),transparent 30%),linear-gradient(#171119 1px,transparent 1px),linear-gradient(90deg,#171119 1px,transparent 1px);background-size:auto,auto,32px 32px,32px 32px}#viewport.dragging{cursor:grabbing}#scene{position:absolute;transform-origin:0 0;width:2500px;height:1450px}svg{position:absolute;inset:0;width:2500px;height:1450px;overflow:visible}.edge{stroke:var(--line);stroke-width:2.5;fill:none;opacity:.82}.edge.marriage{stroke-dasharray:6 5;stroke-width:2}.edge.highlight{stroke:#fff;stroke-width:4;opacity:1}.node{position:absolute;width:180px;min-height:82px;background:linear-gradient(180deg,#251d29,#1c161f);border:1px solid #403344;border-left:5px solid var(--other);border-radius:14px;padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;user-select:none;transition:.15s}.node:hover{transform:translateY(-2px);border-color:#66526e}.node.dim{opacity:.16;filter:grayscale(.6)}.node.match{outline:3px solid white;outline-offset:2px}.node .family{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:5px}.node .name{font-weight:900;font-size:14px;line-height:1.2}.node .meta{font-size:11px;color:var(--muted);margin-top:6px}.node[data-family="Beaumont"]{border-left-color:var(--beaumont)}.node[data-family="Montague"]{border-left-color:var(--montague)}.node[data-family="Holt"]{border-left-color:var(--holt)}.node[data-family="Walker"]{border-left-color:var(--walker)}.node[data-family="Whitmore"]{border-left-color:var(--whitmore)}.node[data-family="Reid"]{border-left-color:var(--reid)}.floating{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;z-index:5}.legend{position:absolute;left:16px;bottom:16px;background:rgba(26,21,29,.92);border:1px solid #382f3c;border-radius:14px;padding:10px 12px;z-index:5;box-shadow:var(--shadow);font-size:12px}.legend-row{display:flex;align-items:center;gap:7px;margin:4px 0}.dot{width:10px;height:10px;border-radius:50%}.drawer{position:absolute;top:0;right:0;height:100%;width:min(370px,92vw);background:#171219;border-left:1px solid #382f3c;z-index:20;transform:translateX(100%);transition:.2s;box-shadow:-20px 0 50px rgba(0,0,0,.35);overflow:auto}.drawer.open{transform:translateX(0)}.drawer-inner{padding:22px}.close{float:right}.drawer h2{font-size:26px;margin:30px 0 4px}.kicker{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.section{margin-top:20px;padding-top:16px;border-top:1px solid #332a36}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#d9c8d5}.person-link{display:block;padding:8px 10px;margin:6px 0;background:#231b27;border:1px solid #392f3d;border-radius:10px;cursor:pointer}.person-link:hover{background:#2c2231}.empty{color:var(--muted);font-size:13px}.note{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#281e2d;border:1px solid #4d3b53;padding:8px 12px;border-radius:999px;font-size:12px;z-index:4;box-shadow:var(--shadow)}@media(max-width:700px){.brand{width:100%;margin:0}.search{min-width:0;width:100%}.controls{width:100%}.legend{display:none}.node{width:160px}.note{display:none}}

<body>
<div class="app"><header><div class="top"><div class="brand">Hollow's Creek <span>Family Tree</span></div><input id="search" class="search" placeholder="Search a person…"><div class="controls"><button class="btn" id="fitBtn">Fit tree</button><button class="btn" id="resetBtn">Reset</button></div></div><div class="subbar" id="familyFilters"><button class="chip active" data-family="All">All families</button><button class="chip" data-family="Beaumont">Beaumont</button><button class="chip" data-family="Montague">Montague</button><button class="chip" data-family="Holt">Holt</button><button class="chip" data-family="Walker">Walker</button><button class="chip" data-family="Whitmore">Whitmore</button></div></header><div class="workspace"><div id="viewport"><div id="scene"><svg id="edges"></svg><div id="nodes"></div></div></div><div class="note">Drag to move • scroll to zoom • click a person for details</div><div class="legend"><strong>Families</strong><div class="legend-row"><span class="dot" style="background:var(--beaumont)"></span> Beaumont</div><div class="legend-row"><span class="dot" style="background:var(--montague)"></span> Montague</div><div class="legend-row"><span class="dot" style="background:var(--holt)"></span> Holt</div><div class="legend-row"><span class="dot" style="background:var(--walker)"></span> Walker</div><div class="legend-row"><span class="dot" style="background:var(--whitmore)"></span> Whitmore</div><div class="legend-row"><span class="dot" style="background:var(--reid)"></span> Reid</div><div class="legend-row"><span style="width:20px;border-top:2px dashed #8f7e8c"></span> partners</div></div><div class="floating"><button class="btn" id="minus">−</button><button class="btn" id="plus">＋</button></div><aside class="drawer" id="drawer"><div class="drawer-inner"><button class="btn close" id="closeDrawer">×</button><div id="drawerContent"></div></div></aside></div></div>

const parentChild=[['michaelReid','ethanReid'],['emilyReid','ethanReid'],['michaelReid','marcusReid'],['emilyReid','marcusReid'],['michaelReid','joanne'],['emilyReid','joanne'],['michaelReid','christina'],['emilyReid','christina'],['lukasSr','lukasJr'],['jewel','lukasJr'],['lukasSr','charlie'],['jewel','charlie'],['lukasSr','libby'],['joanne','libby'],['lukasSr','bethany'],['joanne','bethany'],['lukasSr','reece'],['joanne','reece'],['lukasSr','leon'],['joanne','leon'],['lukasSr','bradley'],['joanne','bradley'],['lukasSr','becca'],['joanne','becca'],['lukasSr','harper'],['michelle','harper'],['lukasSr','melissa'],['rosa','melissa'],['lukasSr','celia'],['rosa','celia'],['lukasSr','henry'],['rosa','henry'],['lukasSr','riley'],['michelle','riley'],['thomasII','thomasIII'],['isabellaM','thomasIII'],['thomasII','claribel'],['isabellaM','claribel'],['thomasII','mattheo'],['isabellaM','mattheo'],['thomasII','alex'],['isabellaM','alex'],['thomasII','delphini'],['isabellaM','delphini'],['becca','luna'],['mattheo','luna'],['becca','lyra'],['mattheo','lyra'],['becca','mason'],['mattheo','mason'],['becca','madison'],['mattheo','madison'],['becca','grace'],['mattheo','grace'],['theoIII','jamie'],['christina','jamie'],['theoIII','theoIV'],['christina','theoIV'],['theoIII','phoebe'],['christina','phoebe'],['caleb','tony'],['hannah','tony'],['caleb','lorenzo'],['hannah','lorenzo'],['caleb','tate'],['hannah','tate'],['caleb','lexie'],['hannah','lexie']];
const marriages=[['lukasSr','jewel'],['lukasSr','joanne'],['thomasII','isabellaM'],['becca','mattheo'],['harper','theoIV'],['theoIII','christina'],['caleb','hannah'],['lorenzo','pansy'],['bethany','ryan']];const byId=Object.fromEntries(people.map(p=>[p.id,p]));const nodesEl=document.getElementById('nodes'),svg=document.getElementById('edges');function nodeCenter(p){return[p.x+90,p.y+41]}function edgePath(a,b,kind){const[ax,ay]=nodeCenter(a),[bx,by]=nodeCenter(b);if(kind==='marriage')return`M ${ax} ${ay} L ${bx} ${by}`;const mid=(ay+by)/2;return`M ${ax} ${ay+41} C ${ax} ${mid}, ${bx} ${mid}, ${bx} ${by-41}`}function drawEdges(){svg.innerHTML='';parentChild.forEach(([a,b])=>{if(!byId[a]||!byId[b])return;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',edgePath(byId[a],byId[b],'child'));p.setAttribute('class','edge');p.dataset.a=a;p.dataset.b=b;svg.appendChild(p)});marriages.forEach(([a,b])=>{if(!byId[a]||!byId[b])return;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',edgePath(byId[a],byId[b],'marriage'));p.setAttribute('class','edge marriage');p.dataset.a=a;p.dataset.b=b;svg.appendChild(p)})}function renderNodes(){nodesEl.innerHTML='';people.forEach(p=>{const el=document.createElement('div');el.className='node';el.dataset.id=p.id;el.dataset.family=p.family;el.style.left=p.x+'px';el.style.top=p.y+'px';el.innerHTML=`<div class="family">${p.family==='Other'?'Connected family':p.family}</div><div class="name">${p.name}</div>${p.meta?`<div class="meta">${p.meta}</div>`:''}`;el.onclick=()=>openPerson(p.id);nodesEl.appendChild(el)})}function relativesFor(id){const parents=parentChild.filter(e=>e[1]===id).map(e=>e[0]),children=parentChild.filter(e=>e[0]===id).map(e=>e[1]),partners=marriages.filter(e=>e.includes(id)).map(e=>e[0]===id?e[1]:e[0]),siblings=people.filter(p=>p.id!==id&&parents.length&&parentChild.some(e=>e[1]===p.id&&parents.includes(e[0]))).map(p=>p.id);return{parents:[...new Set(parents)],children:[...new Set(children)],partners:[...new Set(partners)],siblings:[...new Set(siblings)]}}function personLink(id){const p=byId[id];return p?`<div class="person-link" data-open="${id}">${p.name}</div>`:''}function openPerson(id){const p=byId[id],r=relativesFor(id);if(!p)return;document.getElementById('drawerContent').innerHTML=`<div class="kicker">${p.family==='Other'?'Connected family':p.family+' family'}</div><h2>${p.name}</h2><div class="empty">${p.meta||'Hollow’s Creek family tree record'}</div>${r.parents.length?`<div class="section"><h3>Parents</h3>${r.parents.map(personLink).join('')}</div>`:''}${r.partners.length?`<div class="section"><h3>Partner${r.partners.length>1?'s':''}</h3>${r.partners.map(personLink).join('')}</div>`:''}${r.children.length?`<div class="section"><h3>Children</h3>${r.children.map(personLink).join('')}</div>`:''}${r.siblings.length?`<div class="section"><h3>Siblings</h3>${r.siblings.map(personLink).join('')}</div>`:''}`;document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openPerson(el.dataset.open));document.getElementById('drawer').classList.add('open');highlight(id)}function highlight(id){document.querySelectorAll('.node').forEach(n=>n.classList.toggle('dim',n.dataset.id!==id&&![...svg.querySelectorAll(`[data-a="${id}"],[data-b="${id}"]`)].some(e=>e.dataset.a===n.dataset.id||e.dataset.b===n.dataset.id)));svg.querySelectorAll('.edge').forEach(e=>e.classList.toggle('highlight',e.dataset.a===id||e.dataset.b===id))}function clearHighlight(){document.querySelectorAll('.node').forEach(n=>n.classList.remove('dim','match'));svg.querySelectorAll('.edge').forEach(e=>e.classList.remove('highlight'))}let scale=.62,tx=25,ty=20;const scene=document.getElementById('scene'),viewport=document.getElementById('viewport');function apply(){scene.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}function fit(){const w=viewport.clientWidth,h=viewport.clientHeight;scale=Math.min(w/2480,h/1220,.8);tx=(w-2480*scale)/2;ty=Math.max(10,(h-1220*scale)/2);apply()}viewport.addEventListener('wheel',e=>{e.preventDefault();const rect=viewport.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,old=scale;scale=Math.max(.28,Math.min(1.5,scale*(e.deltaY<0?1.1:.9)));tx=mx-(mx-tx)*(scale/old);ty=my-(my-ty)*(scale/old);apply()},{passive:false});let dragging=false,sx=0,sy=0,stx=0,sty=0;viewport.onpointerdown=e=>{if(e.target.closest('.node'))return;dragging=true;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)};viewport.onpointermove=e=>{if(!dragging)return;tx=stx+(e.clientX-sx);ty=sty+(e.clientY-sy);apply()};viewport.onpointerup=()=>{dragging=false;viewport.classList.remove('dragging')};document.getElementById('plus').onclick=()=>{scale=Math.min(1.5,scale*1.18);apply()};document.getElementById('minus').onclick=()=>{scale=Math.max(.28,scale/1.18);apply()};document.getElementById('fitBtn').onclick=fit;document.getElementById('resetBtn').onclick=()=>{clearHighlight();document.getElementById('search').value='';document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.family==='All'));filterFamily('All');fit()};document.getElementById('closeDrawer').onclick=()=>{document.getElementById('drawer').classList.remove('open');clearHighlight()};function filterFamily(fam){document.querySelectorAll('.node').forEach(n=>n.style.display=(fam==='All'||n.dataset.family===fam)?'block':'none');svg.querySelectorAll('.edge').forEach(e=>{const a=byId[e.dataset.a],b=byId[e.dataset.b];e.style.display=(fam==='All'||(a&&a.family===fam)||(b&&b.family===fam))?'':'none'})}document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');clearHighlight();filterFamily(c.dataset.family)});document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();clearHighlight();if(!q)return;let first=null;document.querySelectorAll('.node').forEach(n=>{const ok=byId[n.dataset.id].name.toLowerCase().includes(q);n.classList.toggle('match',ok);if(ok&&!first)first=byId[n.dataset.id]});if(first){tx=viewport.clientWidth/2-(first.x+90)*scale;ty=viewport.clientHeight/2-(first.y+41)*scale;apply()}});renderNodes();drawEdges();setTimeout(fit,50);
